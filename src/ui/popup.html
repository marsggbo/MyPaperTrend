<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MyPaperTrend</title>
<style>
:root{--bg:#fff;--text:#0f172a;--muted:#64748b;--border:#e6e9ef;--accent:#6366f1;--card:#f7f9fc}
@media(prefers-color-scheme:dark){:root{--bg:#111a2e;--text:#f1f5f9;--muted:#94a3b8;--border:#243149;--accent:#818cf8;--card:#0d1526}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);width:320px;padding:14px}
h1{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.sub{font-size:11px;color:var(--muted);margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px}
.tile .n{font-size:18px;font-weight:800;color:var(--accent)}
.tile .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
.up{color:#10b981}.down{color:#ef4444}
.btns{display:flex;flex-direction:column;gap:6px}
button{font:inherit;font-size:12.5px;font-weight:600;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;text-align:left}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{font-size:12px;color:var(--muted);line-height:1.5;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px}
a{color:var(--accent)}
input[type=file]{display:none}
.credit{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);text-align:center;font-size:11px;color:var(--muted)}
.credit a{font-weight:600}
</style>
</head>
<body>
<h1>📈 MyPaperTrend</h1>
<div class="sub" id="sub">Loading…</div>

<div id="stats"></div>

<div class="btns">
  <button class="primary" id="dash">📊 Open full dashboard</button>
  <button id="scholar">🎓 Open my Scholar profile</button>
  <button id="export">⬇ Export data (JSON)</button>
  <button id="import">⬆ Import data (JSON)</button>
  <button id="settings">⚙ Settings</button>
</div>
<input type="file" id="file" accept="application/json">

<div class="credit">Made by <a href="https://github.com/marsggbo" target="_blank" rel="noopener">marsggbo</a> · <a href="https://github.com/marsggbo/MyPaperTrend" target="_blank" rel="noopener">MyPaperTrend on GitHub</a></div>

<script src="../core/i18n.js"></script>
<script src="../core/schema.js"></script>
<script src="../core/normalizer.js"></script>
<script src="../core/settings.js"></script>
<script src="../core/storage/local.js"></script>
<script src="popup.js"></script>
</body>
</html>
